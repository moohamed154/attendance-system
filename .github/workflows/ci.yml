name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-verify:
    name: Build & Verification Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://localhost/dummy"

      - name: Type Check (TypeScript compile)
        run: npx tsc --noEmit

      - name: Code Style Check (ESLint linting)
        run: npm run lint

      - name: Production Build Compilation
        run: npm run build
        env:
          DATABASE_URL: "postgresql://localhost/dummy"
          JWT_SECRET: "dummy-secret-value-for-ci-pipeline"
